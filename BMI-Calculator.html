<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI-Calculator</title>
    <style>
        .container {
            height: 550px;
            background: linear-gradient(180deg, rgb(54, 54, 146), #beb7b7);
            width: 500px;
            display: flex;
            align-items: center;
            flex-direction: column;
            justify-content: center;
            gap: 40px;
            border-radius: 50px;
        }

        .container .inputs {
            margin-top: 30px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .display {
            font-weight: 700;
            font-size: larger;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 80px;
            border-radius: 5px;
            width: 400px;
            background-color: rgb(217, 235, 229);
        }

        .result {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 50px;
            width: 400px;
            border-radius: 5px;
            background-color: rgb(184, 240, 221);
            font-size: large;
            font-weight: 600;

        }

        .inputs .height {
            margin-left: 10px;
            border-radius: 15px;
            padding: 10px;
            border: none;
        }

        .inputs .weight {
            margin-left: 10px;
            border-radius: 15px;
            padding: 10px;
            border: none;
        }

        .button {
            padding: 8px 15px;
            border-radius: 5px;
            border: none;
            background-color: rgb(126, 20, 225);
            color: white;
            font-weight: 600;
        }

        .button:hover {
            padding: 8px 15px;
            border-radius: 5px;
            border: none;
            background-color: rgb(105, 14, 190);
            color: white;
            font-weight: 600;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="result"></div>
        <div class="display"></div>

        <div class="inputs">
            <div>HEIGHT:<input class="height" type="text" placeholder="in meter"></div>
            <div>WEIGHT:<input class="weight" type="text" placeholder="in kg"></div>
        </div>
        <button class="button">SUBMIT</button>
    </div>



    <script>
        let button = document.querySelector('.button');
        let Display = document.querySelector('.display');
        let Height = document.querySelector('.height');
        let Weight = document.querySelector('.weight');
        let Result = document.querySelector('.result');

        button.addEventListener('click', function BMI() {

            let bmi = Math.floor((Weight.value) / (Height.value * Height.value));
            Result.textContent = `your BMI is ${bmi}`

            if (bmi < 19 && bmi > 0) {
                Display.innerHTML = " UNDERWEIGHT";
            }
            else if (bmi < 25) {
                Display.innerHTML = " NORMAL/FIT";
            }
            else if (bmi < 30) {
                Display.innerHTML = " OVERWEIGHT";
            }
            else if (bmi < 35) {
                Display.innerHTML = " OBESE(class 1)";
            }
            else if (bmi>=40) {
                Display.innerHTML = " OBESE(class 2)";
            }

        })
    </script>
</body>

</html>
